# Mirrors docker-compose's rabbitmq service (see infrastructure/docker/docker-compose.yml and
# docs/adr/0004-use-kafka-for-event-driven-communication.md's 2026-08-05 addendum for why this
# replaced kafka.yaml) - same rabbitmq:4-management-alpine image, same DLQ-queue pre-declaration
# step. Never live-deployed against a real kind cluster (unlike kafka.yaml, which was - ADR 0016);
# this manifest is derived from the working docker-compose config but not yet run through the same
# "actually deploy and fix what breaks" pass, so treat its resource sizing/probe timing as a
# reasonable starting point, not a measured value the way kafka.yaml's was.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: travel-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: travel-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rabbitmq-data }
---
apiVersion: v1
kind: Service
metadata:
  # Every service's RABBITMQ_HOST is "rabbitmq" - name must stay "rabbitmq".
  name: rabbitmq
  namespace: travel-platform
spec:
  selector: { app: rabbitmq }
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
# declare-dlq-queues.sh (infrastructure/rabbitmq/declare-dlq-queues.sh) reused verbatim via
# ConfigMap - same script docker-compose's rabbitmq-init container runs, so DLQ queue definitions
# live in exactly one place regardless of which orchestrator runs them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-declare-dlq-queues
  namespace: travel-platform
data:
  declare-dlq-queues.sh: |
    #!/bin/sh
    set -eu

    API="http://rabbitmq:15672/api/queues/%2f"
    AUTH="guest:guest"

    declare_queue() {
      name="$1"
      curl -sf -u "$AUTH" -X PUT "$API/$name" \
        -H "content-type: application/json" \
        -d '{"durable": true}' \
        -o /dev/null
      echo "Declared queue: $name"
    }

    declare_queue "booking-created.flight-inventory.dlq"
    declare_queue "booking-created.hotel-inventory.dlq"
    declare_queue "booking-created.payment-processor.dlq"
    declare_queue "booking-cancelled.payment-processor.dlq"
    declare_queue "payment-authorized.booking-payment-outcome.dlq"
    declare_queue "payment-failed.booking-payment-outcome.dlq"
    declare_queue "booking-confirmed.notification-processor.dlq"
    declare_queue "flight-created.search-indexer.dlq"
    declare_queue "hotel-created.search-indexer.dlq"

    echo "All DLQ queues declared."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-init
  namespace: travel-platform
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rabbitmq-init
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/scripts/declare-dlq-queues.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: rabbitmq-declare-dlq-queues
            defaultMode: 0755
