# Resource sizing rationale: see identity-service.yaml / ADR 0016. Idle memory measured ~182MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: travel-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: booking-service }
  template:
    metadata:
      labels: { app: booking-service }
    spec:
      # Kubernetes auto-injects <SERVICE>_PORT/<SERVICE>_HOST env vars for every Service in
      # the namespace (legacy Docker-links behavior) - search-service crashed on a real kind run
      # because the opensearch Service produced OPENSEARCH_PORT=tcp://10.x.x.x:9200, colliding
      # with and overriding this app's own OPENSEARCH_PORT=9200 expectation (ADR 0016). DNS
      # (the Service name itself) is how every service already finds the others, so these
      # injected vars are pure risk with no upside - disabled everywhere, not just search-service.
      enableServiceLinks: false
      containers:
        - name: booking-service
          image: travel-platform-booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - { name: MONGO_URI, value: "mongodb://mongodb:27017/?replicaSet=rs0" }
            - { name: RABBITMQ_HOST, value: "rabbitmq" }
            # LocalStack, not real AWS - see docs/adr/0008-use-localstack-and-terraform-for-aws-resources.md.
            - { name: BOOKING_AWS_S3_ENDPOINT_OVERRIDE, value: "http://localstack:4566" }
            - { name: BOOKING_AWS_S3_ACCESS_KEY_ID, value: "test" }
            - { name: BOOKING_AWS_S3_SECRET_ACCESS_KEY, value: "test" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8082 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: travel-platform
spec:
  selector: { app: booking-service }
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service
  namespace: travel-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
