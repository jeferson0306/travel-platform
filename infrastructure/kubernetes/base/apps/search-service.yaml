# Resource sizing rationale: see identity-service.yaml / ADR 0016. Idle memory measured ~153MiB.
# No MONGO_URI - search-service has no MongoDB dependency at all (ADR 0012), OpenSearch is both
# its query engine and only store. OPENSEARCH_HOST/PORT default to "opensearch"/9200 already
# (%prod application.yml), matching this manifest's opensearch Service name/port exactly - no
# override needed, same as docker-compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: travel-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: search-service }
  template:
    metadata:
      labels: { app: search-service }
    spec:
      # Kubernetes auto-injects <SERVICE>_PORT/<SERVICE>_HOST env vars for every Service in
      # the namespace (legacy Docker-links behavior) - search-service crashed on a real kind run
      # because the opensearch Service produced OPENSEARCH_PORT=tcp://10.x.x.x:9200, colliding
      # with and overriding this app's own OPENSEARCH_PORT=9200 expectation (ADR 0016). DNS
      # (the Service name itself) is how every service already finds the others, so these
      # injected vars are pure risk with no upside - disabled everywhere, not just search-service.
      enableServiceLinks: false
      containers:
        - name: search-service
          image: travel-platform-search-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          env:
            - { name: RABBITMQ_HOST, value: "rabbitmq" }
          resources:
            requests: { cpu: 100m, memory: 224Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8087 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8087 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: travel-platform
spec:
  selector: { app: search-service }
  ports:
    - port: 8087
      targetPort: 8087
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-service
  namespace: travel-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
