# The base manifests' resource requests/limits target a real cluster with real headroom (see
# ADR 0016). This machine's Docker Desktop VM only has ~3.8GiB total, which the base's sum of
# requests (~3.7GiB across 13 workloads) leaves no room in for kube-system itself - a service
# landed `Pending` with "Insufficient memory" the first time this ran against `kind` here. Rather
# than quietly shrinking the "real" numbers in base (which should stay honest about what a real
# deployment needs), this overlay - whose whole job is "how this runs on my machine" - trims
# memory requests/limits down to fit, roughly proportional to each container's actual measured
# idle footprint (ADR 0016) with much thinner headroom than base. A real cluster should use base
# directly, or its own overlay sized for its own capacity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: travel-platform
spec:
  template:
    spec:
      containers:
        - name: identity-service
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 288Mi }
---
