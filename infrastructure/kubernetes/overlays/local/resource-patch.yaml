apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: travel-platform
spec:
  template:
    spec:
      containers:
        - name: rabbitmq
          resources:
            # No measured footprint yet - rabbitmq.yaml (base) was never live-deployed against a
            # real kind cluster the way kafka.yaml was (ADR 0016 measured kafka's ~737MiB idle;
            # that finding retired with kafka itself, see ADR 0004's 2026-08-05 addendum). RabbitMQ
            # has no JVM heap to size, so base's own requests/limits are already close to what this
            # constrained overlay would trim to - kept identical here rather than guess a smaller
            # number with no measurement behind it.
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: travel-platform
spec:
  template:
    spec:
      containers:
        - name: opensearch
          resources:
            # 832Mi got OOMKilled on a real run despite the 512m JVM heap cap (OPENSEARCH_JAVA_OPTS
            # in base) - non-heap native memory (Lucene's off-heap segments, thread stacks,
            # metaspace) needs real room on top of the heap, not just a small margin.
            requests: { cpu: 100m, memory: 768Mi }
            limits: { cpu: 500m, memory: 1280Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: travel-platform
spec:
  template:
    spec:
      containers:
        - name: localstack
          resources:
            # LocalStack got OOMKilled repeatedly at a 64Mi/160Mi request/limit on this machine's
            # first kind run (~4GiB Docker Desktop VM) - it needs noticeably more than its idle
            # footprint once its API server actually starts handling requests (S3, SQS, SNS, SES,
            # SecretsManager, SSM and EventBridge are all enabled). It was scaled to 0 entirely for
            # that run (booking-service's receipt upload is best-effort/non-transactional, ADR
            # 0008/0009, so booking creation is unaffected either way) and re-enabled here after
            # raising the Docker Desktop VM to 8GiB - but even 320Mi still got OOMKilled once its
            # API server was actually serving requests, so the limit is higher again - see ADR 0016.
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 300m, memory: 512Mi }
