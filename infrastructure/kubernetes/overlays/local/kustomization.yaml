apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: gateway-service-patch.yaml

# Multi-document strategic-merge file (one Deployment patch per document) - patches: only accepts
# one target per entry, patchesStrategicMerge is what supports a single multi-doc file.
patchesStrategicMerge:
  - resource-patch.yaml
