name: travel-platform

# Base local infrastructure for Phase 0. Application services (identity-service,
# booking-service, ...) are added to this file as they are built, each in its
# own compose "profile" so the full stack does not have to run at once.
#
# Usage: make up   (see root Makefile)

services:
  mongodb:
    image: mongo:7.0
    container_name: travel-platform-mongodb
    restart: unless-stopped
    # Single-node replica set, not standalone: multi-document transactions
    # (used by the outbox pattern - see docs/adr/0007-transactional-outbox.md)
    # require one. No auth on this local instance - it is not exposed
    # beyond the host, and Quarkus Dev Services provisions an equivalent
    # ephemeral replica-set Mongo automatically for `quarkus:dev`/tests, so
    # this container is mainly for docker-compose-only workflows. A real
    # environment (MongoDB Atlas) is always authenticated - see
    # docs/adr/0003-use-mongodb-as-primary-database.md.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-platform

  mongodb-init:
    image: mongo:7.0
    container_name: travel-platform-mongodb-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        mongosh --host mongodb --quiet --eval '
        try { rs.status(); print("replica set already initiated"); }
        catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}); print("replica set initiated"); }
        '
    networks:
      - travel-platform

  redis:
    image: redis:7.4-alpine
    container_name: travel-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-platform

  kafka:
    image: apache/kafka:3.8.0
    container_name: travel-platform-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - travel-platform

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: travel-platform-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ../kafka/create-topics.sh:/scripts/create-topics.sh:ro
    networks:
      - travel-platform

  localstack:
    image: localstack/localstack:3.7
    container_name: travel-platform-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,sns,ses,secretsmanager,ssm,eventbridge
      DEBUG: "0"
      PERSISTENCE: "1"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - travel-platform

networks:
  travel-platform:
    name: travel-platform

volumes:
  mongodb_data:
  kafka_data:
  localstack_data:
