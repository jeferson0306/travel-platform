quarkus:
  application:
    name: search-service
  http:
    port: 8087
  smallrye-openapi:
    path: /openapi
  smallrye-health:
    root-path: /health
  log:
    console:
      json:
        enabled: true
  otel:
    # See identity-service/src/main/resources/application.yml for the rationale -
    # no collector locally, traceId/spanId still populate the logs.
    traces:
      exporter: none
  kafka:
    devservices:
      # Tests use the in-memory connector (see %test below).
      enabled: false

# No MongoDB config here on purpose - this service has no MongoDB at all, see
# docs/adr/0012-search-service-opensearch.md.
search:
  opensearch:
    host: localhost
    port: 9200
    scheme: http

mp:
  messaging:
    incoming:
      flight-created:
        connector: smallrye-kafka
        topic: flight-created
        group.id: search-indexer
        auto.offset.reset: earliest
      hotel-created:
        connector: smallrye-kafka
        topic: hotel-created
        group.id: search-indexer
        auto.offset.reset: earliest
    outgoing:
      flight-created-dlq:
        connector: smallrye-kafka
        topic: flight-created.search-indexer.dlq
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      hotel-created-dlq:
        connector: smallrye-kafka
        topic: hotel-created.search-indexer.dlq
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer

"%dev":
  quarkus:
    log:
      console:
        json:
          enabled: false

"%test":
  quarkus:
    log:
      console:
        json:
          enabled: false
  mp:
    messaging:
      incoming:
        flight-created:
          connector: smallrye-in-memory
        hotel-created:
          connector: smallrye-in-memory
      outgoing:
        flight-created-dlq:
          connector: smallrye-in-memory
        hotel-created-dlq:
          connector: smallrye-in-memory

"%prod":
  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS}
  search:
    opensearch:
      host: ${OPENSEARCH_HOST:opensearch}
      port: ${OPENSEARCH_PORT:9200}
      scheme: ${OPENSEARCH_SCHEME:http}
