quarkus:
  application:
    name: flight-service
  http:
    port: 8083
  mongodb:
    database: flight
  smallrye-openapi:
    path: /openapi
  smallrye-health:
    root-path: /health
  log:
    console:
      json:
        enabled: true
  otel:
    # See identity-service/src/main/resources/application.yml for the rationale -
    # no collector locally, traceId/spanId still populate the logs.
    traces:
      exporter: none
  kafka:
    devservices:
      # See booking-service/src/main/resources/application.yml for the rationale - tests use
      # the in-memory connector (see %test below).
      enabled: false

mp:
  jwt:
    verify:
      issuer: travel-platform-identity
      publickey:
        location: publicKey.pem
  messaging:
    incoming:
      booking-created:
        connector: smallrye-kafka
        topic: booking-created
        group.id: flight-inventory
        auto.offset.reset: earliest
    outgoing:
      booking-created-dlq:
        connector: smallrye-kafka
        topic: booking-created.flight-inventory.dlq
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      flight-events:
        connector: smallrye-kafka
        # Overridden per-message by OutboxRelay (topic = the event's eventType) - this
        # default only satisfies config validation and is never actually used.
        topic: flight-events-default
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer

"%dev":
  quarkus:
    log:
      console:
        json:
          enabled: false

"%test":
  quarkus:
    mongodb:
      database: flight-test
    log:
      console:
        json:
          enabled: false
  mp:
    messaging:
      incoming:
        booking-created:
          connector: smallrye-in-memory
      outgoing:
        booking-created-dlq:
          connector: smallrye-in-memory
        flight-events:
          connector: smallrye-in-memory

"%prod":
  quarkus:
    mongodb:
      connection-string: ${MONGO_URI}
  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS}
