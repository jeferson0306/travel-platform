quarkus:
  application:
    name: flight-service
  http:
    port: 8083
    cors:
      enabled: true
      origins: ${CORS_ORIGINS:http://localhost:5173}
      methods: GET,OPTIONS
  mongodb:
    database: flight
  smallrye-openapi:
    path: /openapi
  smallrye-health:
    root-path: /health
  log:
    console:
      json:
        enabled: true
  otel:
    # See identity-service/src/main/resources/application.yml for the rationale -
    # no collector locally, traceId/spanId still populate the logs.
    traces:
      exporter: none
  rabbitmq:
    devservices:
      # See booking-service/src/main/resources/application.yml for the rationale - tests use
      # the in-memory connector (see %test below).
      enabled: false

mp:
  jwt:
    verify:
      issuer: travel-platform-identity
      publickey:
        location: publicKey.pem
  messaging:
    # See booking-service/src/main/resources/application.yml for the exchange/queue topology
    # rationale (docs/adr/0004-use-kafka-for-event-driven-communication.md's 2026-08-05 addendum).
    incoming:
      booking-created:
        connector: smallrye-rabbitmq
        exchange:
          name: booking-events
        queue:
          name: booking-created.flight-inventory
        routing-keys: booking-created
    outgoing:
      booking-created-dlq:
        connector: smallrye-rabbitmq
        exchange:
          name: ""
        default-routing-key: booking-created.flight-inventory.dlq
      flight-events:
        connector: smallrye-rabbitmq
        exchange:
          name: flight-events
        # Overridden per-message by OutboxRelay (routing key = the event's eventType) - this
        # default only satisfies config validation and is never actually used.
        default-routing-key: flight-events-default

"%dev":
  quarkus:
    log:
      console:
        json:
          enabled: false

"%test":
  quarkus:
    mongodb:
      database: flight-test
    log:
      console:
        json:
          enabled: false
  mp:
    messaging:
      incoming:
        booking-created:
          connector: smallrye-in-memory
      outgoing:
        booking-created-dlq:
          connector: smallrye-in-memory
        flight-events:
          connector: smallrye-in-memory

"%prod":
  quarkus:
    mongodb:
      connection-string: ${MONGO_URI}
  rabbitmq-host: ${RABBITMQ_HOST}
  rabbitmq-port: ${RABBITMQ_PORT:5672}
  rabbitmq-username: ${RABBITMQ_USERNAME:guest}
  rabbitmq-password: ${RABBITMQ_PASSWORD:guest}
