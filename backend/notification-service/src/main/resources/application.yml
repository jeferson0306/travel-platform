quarkus:
  application:
    name: notification-service
  http:
    port: 8086
    # CORS is handled solely at the gateway (backend/gateway/src/main/resources/application.yml)
    # - the only browser-facing surface. Quarkus's declarative CORS here would evaluate the Origin
    # header the gateway forwards along on every proxied request and reject it with 403 before
    # this service ever ran the request, since these internal calls aren't real browser requests
    # (observed directly: it was the actual root cause of a gateway 403 mis-diagnosed as a gateway
    # bug - each service's own CORS filter, not the gateway, was rejecting the proxied request).
  mongodb:
    database: notification
  smallrye-openapi:
    path: /openapi
  smallrye-health:
    root-path: /health
  log:
    console:
      json:
        enabled: true
  otel:
    # See identity-service/src/main/resources/application.yml for the rationale -
    # no collector locally, traceId/spanId still populate the logs.
    traces:
      exporter: none
  rabbitmq:
    devservices:
      # See booking-service/src/main/resources/application.yml for the rationale - tests use
      # the in-memory connector (see %test below).
      enabled: false

mp:
  jwt:
    verify:
      issuer: travel-platform-identity
      publickey:
        location: publicKey.pem
  messaging:
    # See booking-service/src/main/resources/application.yml for the exchange/queue topology
    # rationale (docs/adr/0004-use-kafka-for-event-driven-communication.md's 2026-08-05 addendum).
    incoming:
      booking-confirmed:
        connector: smallrye-rabbitmq
        exchange:
          name: booking-events
        queue:
          name: booking-confirmed.notification-processor
        routing-keys: booking-confirmed
    outgoing:
      booking-confirmed-dlq:
        connector: smallrye-rabbitmq
        exchange:
          name: ""
        default-routing-key: booking-confirmed.notification-processor.dlq

"%dev":
  quarkus:
    log:
      console:
        json:
          enabled: false

"%test":
  quarkus:
    mongodb:
      database: notification-test
    log:
      console:
        json:
          enabled: false
  mp:
    messaging:
      incoming:
        booking-confirmed:
          connector: smallrye-in-memory
      outgoing:
        booking-confirmed-dlq:
          connector: smallrye-in-memory

"%prod":
  quarkus:
    mongodb:
      connection-string: ${MONGO_URI}
  rabbitmq-host: ${RABBITMQ_HOST}
  rabbitmq-port: ${RABBITMQ_PORT:5672}
  rabbitmq-username: ${RABBITMQ_USERNAME:guest}
  rabbitmq-password: ${RABBITMQ_PASSWORD:guest}
