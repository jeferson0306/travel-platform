quarkus:
  application:
    name: booking-service
  http:
    port: 8082
    cors:
      enabled: true
      origins: ${CORS_ORIGINS:http://localhost:5173}
      methods: GET,OPTIONS
  mongodb:
    database: booking
  smallrye-openapi:
    path: /openapi
  smallrye-health:
    root-path: /health
  log:
    console:
      json:
        enabled: true
  otel:
    # See identity-service/src/main/resources/application.yml for the rationale -
    # no collector locally, traceId/spanId still populate the logs.
    traces:
      exporter: none
  rabbitmq:
    devservices:
      # Never needed: tests use the in-memory connector (see %test below), and quarkus:dev/prod
      # use the real broker from docker-compose - its host-mapped port (5672) matches the
      # connector's own default (host=localhost, port=5672), so no %dev override is needed either,
      # same reasoning the old Kafka config relied on. Leaving Dev Services on would start a
      # second, unused RabbitMQ per test run.
      enabled: false

booking:
  aws:
    receipts-bucket: booking-receipts
    s3:
      region: ${AWS_REGION:us-east-1}
      # Empty (default) means "use the AWS SDK's default endpoint/credential chain" - a real AWS
      # account. Only overridden below for %dev/%test, which point at LocalStack instead - see
      # docs/adr/0008-use-localstack-and-terraform-for-aws-resources.md.

mp:
  jwt:
    verify:
      issuer: travel-platform-identity
      publickey:
        location: publicKey.pem
  messaging:
    # Topology: each publishing service owns one topic exchange (named after its outgoing
    # channel, e.g. "payment-events"); each consumer declares its own durable queue bound to
    # that exchange with a routing key matching the specific event type it wants - the same
    # shape as the old "topic = eventType, one consumer group per topic" Kafka model, just
    # expressed as exchange+routing-key+queue instead of topic+partition+consumer-group. See
    # docs/adr/0004-use-kafka-for-event-driven-communication.md's 2026-08-05 addendum.
    incoming:
      payment-authorized:
        connector: smallrye-rabbitmq
        exchange:
          name: payment-events
        queue:
          name: payment-authorized.booking-payment-outcome
        routing-keys: payment-authorized
      payment-failed:
        connector: smallrye-rabbitmq
        exchange:
          name: payment-events
        queue:
          name: payment-failed.booking-payment-outcome
        routing-keys: payment-failed
    outgoing:
      booking-events:
        connector: smallrye-rabbitmq
        exchange:
          name: booking-events
        # Overridden per-message by OutboxRelay (routing key = the event's eventType) - this
        # default only satisfies config validation and is never actually used.
        default-routing-key: booking-events-default
      payment-authorized-dlq:
        connector: smallrye-rabbitmq
        # Empty exchange name = RabbitMQ's default exchange, which every queue is implicitly
        # bound to under its own name - publishes straight to the DLQ queue pre-declared by
        # infrastructure/rabbitmq/declare-dlq-queues.sh, no topic exchange needed for a
        # fixed, single-purpose destination like this one.
        exchange:
          name: ""
        default-routing-key: payment-authorized.booking-payment-outcome.dlq
      payment-failed-dlq:
        connector: smallrye-rabbitmq
        exchange:
          name: ""
        default-routing-key: payment-failed.booking-payment-outcome.dlq

"%dev":
  quarkus:
    log:
      console:
        json:
          enabled: false
  booking:
    aws:
      s3:
        # LocalStack, not real AWS. The credentials are the well-known LocalStack fake pair
        # (test/test), not a secret - see SECURITY.md.
        endpoint-override: http://localhost:4566
        access-key-id: test
        secret-access-key: test

"%test":
  quarkus:
    mongodb:
      database: booking-test
    log:
      console:
        json:
          enabled: false
  booking:
    aws:
      s3:
        endpoint-override: http://localhost:4566
        access-key-id: test
        secret-access-key: test
  mp:
    messaging:
      incoming:
        payment-authorized:
          connector: smallrye-in-memory
        payment-failed:
          connector: smallrye-in-memory
      outgoing:
        booking-events:
          connector: smallrye-in-memory
        payment-authorized-dlq:
          connector: smallrye-in-memory
        payment-failed-dlq:
          connector: smallrye-in-memory

"%prod":
  quarkus:
    mongodb:
      connection-string: ${MONGO_URI}
  rabbitmq-host: ${RABBITMQ_HOST}
  rabbitmq-port: ${RABBITMQ_PORT:5672}
  rabbitmq-username: ${RABBITMQ_USERNAME:guest}
  rabbitmq-password: ${RABBITMQ_PASSWORD:guest}
