quarkus:
  application:
    name: booking-service
  http:
    port: 8082
    cors:
      enabled: true
      origins: ${CORS_ORIGINS:http://localhost:5173}
      methods: GET,OPTIONS
  mongodb:
    database: booking
  smallrye-openapi:
    path: /openapi
  smallrye-health:
    root-path: /health
  log:
    console:
      json:
        enabled: true
  otel:
    # See identity-service/src/main/resources/application.yml for the rationale -
    # no collector locally, traceId/spanId still populate the logs.
    traces:
      exporter: none
  kafka:
    devservices:
      # Never needed: tests use the in-memory connector (see %test below),
      # and local/prod use the real broker from docker-compose/KAFKA_BOOTSTRAP_SERVERS.
      # Leaving Dev Services on would start a second, unused Kafka per test run.
      enabled: false

booking:
  aws:
    receipts-bucket: booking-receipts
    s3:
      region: ${AWS_REGION:us-east-1}
      # Empty (default) means "use the AWS SDK's default endpoint/credential chain" - a real AWS
      # account. Only overridden below for %dev/%test, which point at LocalStack instead - see
      # docs/adr/0008-use-localstack-and-terraform-for-aws-resources.md.

mp:
  jwt:
    verify:
      issuer: travel-platform-identity
      publickey:
        location: publicKey.pem
  messaging:
    incoming:
      payment-authorized:
        connector: smallrye-kafka
        topic: payment-authorized
        group.id: booking-payment-outcome
        auto.offset.reset: earliest
      payment-failed:
        connector: smallrye-kafka
        topic: payment-failed
        group.id: booking-payment-outcome
        auto.offset.reset: earliest
    outgoing:
      booking-events:
        connector: smallrye-kafka
        # Overridden per-message by OutboxRelay (topic = the event's eventType) - this
        # default only satisfies config validation and is never actually used.
        topic: booking-events-default
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      payment-authorized-dlq:
        connector: smallrye-kafka
        topic: payment-authorized.booking-payment-outcome.dlq
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      payment-failed-dlq:
        connector: smallrye-kafka
        topic: payment-failed.booking-payment-outcome.dlq
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer

"%dev":
  quarkus:
    log:
      console:
        json:
          enabled: false
  booking:
    aws:
      s3:
        # LocalStack, not real AWS. The credentials are the well-known LocalStack fake pair
        # (test/test), not a secret - see SECURITY.md.
        endpoint-override: http://localhost:4566
        access-key-id: test
        secret-access-key: test

"%test":
  quarkus:
    mongodb:
      database: booking-test
    log:
      console:
        json:
          enabled: false
  booking:
    aws:
      s3:
        endpoint-override: http://localhost:4566
        access-key-id: test
        secret-access-key: test
  mp:
    messaging:
      incoming:
        payment-authorized:
          connector: smallrye-in-memory
        payment-failed:
          connector: smallrye-in-memory
      outgoing:
        booking-events:
          connector: smallrye-in-memory
        payment-authorized-dlq:
          connector: smallrye-in-memory
        payment-failed-dlq:
          connector: smallrye-in-memory

"%prod":
  quarkus:
    mongodb:
      connection-string: ${MONGO_URI}
  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS}
